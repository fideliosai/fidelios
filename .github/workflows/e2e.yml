name: E2E Tests

on:
  workflow_dispatch:
    inputs:
      skip_llm:
        description: "Skip LLM-dependent assertions (default: true)"
        type: boolean
        default: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIDELIOS_E2E_SKIP_LLM: ${{ inputs.skip_llm && 'true' || 'false' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: |
          # --with-deps installs system libs before playwright verifies the browser binary;
          # without it the post-download verification hangs on missing shared libraries.
          # --no-shell skips chromium-headless-shell (not used by tests).
          for attempt in 1 2; do
            echo "::group::Playwright install (attempt $attempt/2)"
            if npx playwright install --with-deps --no-shell chromium; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "Playwright install attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          echo "Playwright install failed after 2 attempts"
          exit 1

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Run e2e tests
        run: pnpm run test:e2e

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14

